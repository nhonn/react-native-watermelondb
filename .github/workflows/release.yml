name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release mid-publish; queue the next push instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install system dependencies
        run: sudo apt-get install -y libsqlite3-dev

      - name: Install npm dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: |
          bun run test
          bun run test:cpp

      - name: Build lib
        run: bun run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bun run release

      # GitHub Packages requires a scope matching the repo owner, so the same
      # build is re-published as @nhonn/react-native-watermelondb. semantic-release
      # has already bumped package.json; skip when that version is already there.
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/gh-packages.npmrc"
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > "$NPM_CONFIG_USERCONFIG"
          npm pkg set name=@nhonn/react-native-watermelondb
          npm pkg delete publishConfig.registry
          VERSION=$(node -p "require('./package.json').version")
          if [ "$(npm view "@nhonn/react-native-watermelondb@${VERSION}" version --registry https://npm.pkg.github.com 2>/dev/null)" = "${VERSION}" ]; then
            echo "Already published ${VERSION}"
          else
            npm publish --registry https://npm.pkg.github.com --access public
          fi
